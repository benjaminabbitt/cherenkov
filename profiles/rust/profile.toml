extensions = ["rs"]
exclude = ["**/target/**", "**/tests/**", "**/benches/**", "**/examples/**", "**/build.rs"]
unit_types = ["()", "!"]
disabled_operators = []
# The contents of a function body that returns a value; {} marks the value.
body_template = "{}"
# Bodies are delimited by braces; their contents lie between.
body_braces = true
# Comment syntax: a body's contents start after leading comments.
line_comment = "//"
block_comment = ["/*", "*/"]

[defaults]
bool = "false"
i8 = "0"
i16 = "0"
i32 = "0"
i64 = "0"
i128 = "0"
isize = "0"
u8 = "0"
u16 = "0"
u32 = "0"
u64 = "0"
u128 = "0"
usize = "0"
f32 = "0.0"
f64 = "0.0"
