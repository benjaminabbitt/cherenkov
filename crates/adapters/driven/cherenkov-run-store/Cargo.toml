[package]
name = "cherenkov-run-store"
description = "Where a mutation-test run's streams are kept: angzarr's SQLite store in a file under the project, or angzarr-ports' in-memory store for a run that need not outlive the process."
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-ports.workspace = true
angzarr-store-sqlite.workspace = true
file-lock.workspace = true
file-system.workspace = true
os.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
test-dir.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
