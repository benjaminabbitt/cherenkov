[package]
name = "cherenkov-run-application"
description = "A mutation-test run on angzarr-embedded's kernel and bus: the runner (a projector over the workers), the policies between the run and its mutants, the live runs read model, and following a run."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-diagnostic.workspace = true
angzarr-embedded.workspace = true
angzarr-embedded-macros.workspace = true
cherenkov-core.workspace = true
cherenkov-run-domain.workspace = true
cherenkov-run-ports.workspace = true
cherenkov-run-wire.workspace = true
tokio.workspace = true

[dev-dependencies]
cherenkov-embedded-edge.workspace = true
# `Samples`, the tests' clock and ids.
angzarr-embedded = { workspace = true, features = ["test-support"] }
# The in-memory store the tests run on.
angzarr-ports.workspace = true
cherenkov-syntax.workspace = true
# The tests' store implements the outbox over angzarr's id type.
uuid.workspace = true

[lints]
workspace = true
