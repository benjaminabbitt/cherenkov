[package]
name = "cherenkov-wiring"
description = "The composition root of the run layer: the clock and ids, the async runtime, the store, and angzarr's App with the bus hosted on it, under the application."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `testing::sampling`: angzarr's `Samples` and numbered run ids, for the
# tests of the crates that start runs.
test-support = ["angzarr-embedded/test-support"]

[dependencies]
angzarr-embedded.workspace = true
cherenkov-mutation.workspace = true
cherenkov-embedded-edge.workspace = true
cherenkov-run-application.workspace = true
cherenkov-run-domain.workspace = true
cherenkov-run-store.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
# The tests' own clock and ids.
cherenkov-wiring = { workspace = true, features = ["test-support"] }
angzarr-ports.workspace = true
cherenkov-run-ports.workspace = true
cherenkov-run-wire.workspace = true
cherenkov-syntax.workspace = true
test-dir.workspace = true

[lints]
workspace = true
