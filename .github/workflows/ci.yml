# All logic lives in justfile recipes; these jobs only install tools and
# invoke them. The mutation dogfood job is a later addition (see docs/dogfood).
#
# Every action is pinned to a commit, its release in the comment; every tool
# to a version.

name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  TOOLS: just@1.40.0
  PROTOC_VERSION: "21.12"
  RUST_TOOLCHAIN: "1.96"

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: ${{ env.TOOLS }}
      - run: just scan-secrets-all

  check:
    name: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (Cargo.toml rust-version)
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy --no-self-update && rustup default "$RUST_TOOLCHAIN"
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: ${{ env.TOOLS }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: just check
