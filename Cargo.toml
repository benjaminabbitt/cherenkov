[workspace]
resolver = "3"
# The rings' crates, crates/<ring>/<role>/<crate>, and the test-only fidelity
# crate, which sits in no ring (crates/test/fidelity).
members = ["crates/core/*/*", "crates/adapters/*/*", "crates/root/*/*", "crates/test/*/*"]
exclude = ["fixtures"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0 OR BSD-3-Clause"
publish = false

[workspace.dependencies]
cherenkov-mutation = { path = "crates/core/domain/cherenkov-mutation" }
cherenkov-dap-types = { path = "crates/adapters/driven/cherenkov-dap-types" }
cherenkov-exec-dap = { path = "crates/adapters/driven/cherenkov-exec-dap" }
cherenkov-syntax = { path = "crates/adapters/driven/cherenkov-syntax" }
cherenkov-fs = { path = "crates/adapters/driven/cherenkov-fs" }
cherenkov-run-wire = { path = "crates/core/wire/cherenkov-run-wire" }
cherenkov-run-domain = { path = "crates/core/domain/cherenkov-run-domain" }
cherenkov-run-application = { path = "crates/core/application/cherenkov-run-application" }
cherenkov-run-store = { path = "crates/adapters/driven/cherenkov-run-store" }
cherenkov-run-ports = { path = "crates/core/ports/cherenkov-run-ports" }
cherenkov-embedded-edge = { path = "crates/adapters/driven/cherenkov-embedded-edge" }
cherenkov-cli = { path = "crates/adapters/driving/cherenkov-cli" }
cherenkov-wiring = { path = "crates/root/lib/cherenkov-wiring" }
# The angzarr family, pinned by full commit to one revision of the one angzarr
# workspace (github.com/angzarr-io/angzarr), so the lock holds one core:
# angzarr-embedded (its kernel, bus and markup macros), angzarr-ports (the
# in-memory store, and its `Recovery`),
# angzarr-proto and angzarr-build (with angzarr-codegen: the wire and
# domain crates' build dependency, generating from proto/ into OUT_DIR).
angzarr-embedded = { git = "https://github.com/angzarr-io/angzarr", rev = "69dc4a9eeae84c5bb235249e0312f6db4653895a" }
# The kernel's App: the application over a store, its registry and settings.
angzarr-embedded-host = { git = "https://github.com/angzarr-io/angzarr", rev = "69dc4a9eeae84c5bb235249e0312f6db4653895a" }
angzarr-store-sqlite = { git = "https://github.com/angzarr-io/angzarr", rev = "69dc4a9eeae84c5bb235249e0312f6db4653895a" }
angzarr-embedded-macros = { git = "https://github.com/angzarr-io/angzarr", rev = "69dc4a9eeae84c5bb235249e0312f6db4653895a" }
angzarr-ports = { git = "https://github.com/angzarr-io/angzarr", rev = "69dc4a9eeae84c5bb235249e0312f6db4653895a", features = ["memory"] }
# angzarr's own messages, which the run layer's protos embed (its UUID).
angzarr-proto = { git = "https://github.com/angzarr-io/angzarr", rev = "69dc4a9eeae84c5bb235249e0312f6db4653895a" }
angzarr-build = { git = "https://github.com/angzarr-io/angzarr", rev = "69dc4a9eeae84c5bb235249e0312f6db4653895a" }
# rust-support (github.com/benjaminabbitt/rust-support), the generic substrate, at the
# one commit angzarr pins: the coded errors and the presentation the CLI renders
# through, cli-support (the CLI's failure, its reporter and the exit-code
# convention), and the store's exclusive lock (`cherenkov-run-store`): the
# advisory file lock, and the file-system seam and host it is taken through.
coded-diagnostic = { git = "https://github.com/benjaminabbitt/rust-support", rev = "dcb930d198706371d8e7496ec5ec35efb067b92f" }
presentation = { git = "https://github.com/benjaminabbitt/rust-support", rev = "dcb930d198706371d8e7496ec5ec35efb067b92f" }
cli-support = { git = "https://github.com/benjaminabbitt/rust-support", rev = "dcb930d198706371d8e7496ec5ec35efb067b92f" }
file-lock = { git = "https://github.com/benjaminabbitt/rust-support", rev = "dcb930d198706371d8e7496ec5ec35efb067b92f" }
file-system = { git = "https://github.com/benjaminabbitt/rust-support", rev = "dcb930d198706371d8e7496ec5ec35efb067b92f" }
os = { git = "https://github.com/benjaminabbitt/rust-support", rev = "dcb930d198706371d8e7496ec5ec35efb067b92f" }
# A test's directory, removed when the test ends, a panic included.
test-dir = { git = "https://github.com/benjaminabbitt/rust-support", rev = "dcb930d198706371d8e7496ec5ec35efb067b92f" }
# prost must be the version angzarr-proto generates for.
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v7"] }
base64 = "0.23.1"
rustix = { version = "1.1.6", features = ["process", "thread"] }
# A process's state by pid, the same on every OS (a zombie is not running).
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
bitflags = { version = "2.13.2", features = ["serde"] }
clap = { version = "4.6.8", features = ["derive"] }
globset = "0.4.21"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
streaming-iterator = "0.1.9"
toml = "1.2.1"
tree-sitter = "0.27.2"
tree-sitter-go = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
iced-x86 = { version = "1.22.0", default-features = false, features = ["std", "decoder", "instr_info"] }
gimli = { version = "0.34.0", default-features = false, features = ["read", "std", "endian-reader"] }
object = { version = "0.41.0", default-features = false, features = ["read", "std"] }
walkdir = "2.5.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
invisible_characters = "deny"
unicode_not_nfc = "deny"
non_ascii_literal = "deny"
# Complexity, at clippy's defaults except nesting, whose threshold is in
# clippy.toml. A warning is fixed by refactoring, never suppressed.
cognitive_complexity = "warn"
too_many_lines = "warn"
excessive_nesting = "warn"
